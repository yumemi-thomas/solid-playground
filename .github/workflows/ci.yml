name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - name: Check formatting
        run: pnpm exec oxfmt --check .

      - name: Typecheck the playground
        run: pnpm exec tsc -p packages/playground/tsconfig.json --noEmit

      # The two checks that guard the lint boundary itself: that the serverless
      # linter still runs on a Linux runner, and that every rule example still
      # reports what its catalog entry claims. A solid-checker upgrade that
      # renames or retires a rule fails here rather than in the deployed UI.
      - run: pnpm run test:lint-api

      - run: pnpm run test:examples

      - run: pnpm run test:linter-worker

      - run: pnpm run test:service-worker

      - run: pnpm run build
